mmwave_radar:
  ros__parameters:
    # ttyUSB numbers change on replug, and two CP2102 adapters here share serial
    # "0001" so /dev/serial/by-id is ambiguous. This is the USB socket path of the
    # radar adapter (port 10.3); the UM982 GPS is on 10.4.
    port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:10.3:1.0-port0
    baudrate: 115200
    frame_id: mmwave_radar_link
    stale_timeout_s: 3.0
    # none = vendor Arduino library behaviour. Try crlf (or lf) if commands
    # never get a "Done" reply in the log.
    command_terminator: none
    send_start_on_connect: true

    # Written to sensor flash only when apply_config_on_start is true or the
    # ~/apply_config service is called. Flat [start, end, ...] in metres,
    # up to 4 ascending segments within 0-9 m (0.15 m resolution).
    apply_config_on_start: false
    detection_ranges: [0.0, 9.0]
    detect_latency_s: 0.0    # delay before reporting a new target (25 ms steps)
    clear_latency_s: 0.0     # delay before reporting the target left
