<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">tetra_gpio_controller 동작 흐름</title>
  <desc id="dsc">/gpio_status 의 출력 0~7 중 하나가 0에서 1로 바뀌면 정해진 서비스나 액션을 부르고, 그 출력을 power_outport_cmd 로 다시 0으로 되돌린다.</desc>
  <style>
    .panel{fill:#F7F9FA;stroke:#E0E6EA}
    .box{fill:#FFFFFF;stroke:#B0BEC5;stroke-width:1.5}
    .ros{fill:#FFFFFF;stroke:#00897B;stroke-width:2}
    .t{fill:#263238}
    .s{fill:#546E7A}
    .h{fill:#E53935}
    .ln{stroke:#B0BEC5;stroke-width:1.5;fill:none}
    .sig{stroke:#263238;stroke-width:2.5;fill:none}
    .edge{stroke:#E53935;stroke-width:3.5;fill:none}
    .back{stroke:#E53935;stroke-width:2;fill:none;stroke-dasharray:6 5}
    .mono{font-family:'DejaVu Sans Mono',Consolas,Menlo,monospace}
    .row{fill:#FFFFFF;stroke:#E0E6EA}
    .hl{fill:#FBC02D;opacity:0}
    .tagc{fill:#B2DFDB}.tags{fill:#FFE9A8}.taga{fill:#D1C4E9}
    @media (prefers-color-scheme: dark){
      .panel{fill:#161B22;stroke:#30363D}
      .box,.ros,.row{fill:#0D1117}
      .row{stroke:#30363D}
      .ros{stroke:#26A69A}
      .t{fill:#E6EDF3}
      .s{fill:#9DA7B1}
      .h{fill:#FF6F60}
      .ln{stroke:#484F58}
      .sig{stroke:#E6EDF3}
      .edge{stroke:#FF6F60}
      .back{stroke:#FF6F60}
      .hl{fill:#9E7C12}
      .tagc{fill:#0F3D38}.tags{fill:#3D3110}.taga{fill:#2E2547}
    }
    .hl{animation:hl 8s linear infinite}
    .r1{animation-delay:1s}.r2{animation-delay:2s}.r3{animation-delay:3s}.r4{animation-delay:4s}
    .r5{animation-delay:5s}.r6{animation-delay:6s}.r7{animation-delay:7s}
    .pulse{animation:pu 1s ease-out infinite}
    @keyframes hl{0%{opacity:0}3%{opacity:.55}10%{opacity:.55}13%,100%{opacity:0}}
    @keyframes pu{0%{opacity:1}60%{opacity:.25}100%{opacity:1}}
    @media (prefers-reduced-motion: reduce){ .hl,.pulse{animation:none} }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909C"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E53935"/></marker>
  </defs>

  <rect class="panel" x="10" y="10" width="940" height="450" rx="14"/>

  <!-- 입력 -->
  <rect class="ros" x="30" y="60" width="230" height="96" rx="10"/>
  <text class="t mono" x="145" y="88" font-size="15" font-weight="700" text-anchor="middle">/gpio_status</text>
  <text class="s mono" x="145" y="110" font-size="12" text-anchor="middle">interfaces/msg/Gpio</text>
  <text class="s" x="145" y="134" font-size="13" text-anchor="middle">output0 ~ output7 (0/1)</text>

  <!-- 신호 그림 -->
  <text class="s" x="30" y="196" font-size="13">한 출력의 값 변화</text>
  <polyline class="sig" points="36,262 96,262 96,218 196,218 196,262 252,262"/>
  <line class="edge pulse" x1="96" y1="262" x2="96" y2="218"/>
  <text class="t" x="40" y="282" font-size="12">0</text><text class="t" x="140" y="210" font-size="12">1</text><text class="t" x="222" y="282" font-size="12">0</text>
  <text class="h" x="30" y="302" font-size="13" font-weight="700">0→1 (상승 에지)에서만 실행</text>
  <text class="s" x="30" y="324" font-size="12">1→0 은 노드가 출력을 되돌린 것</text>
  <text class="s" x="30" y="344" font-size="12">처음 받은 값은 기준으로만 저장</text>

  <!-- 에지 검출 -->
  <rect class="box" x="290" y="170" width="150" height="80" rx="10"/>
  <text class="t" x="365" y="200" font-size="14" font-weight="700" text-anchor="middle">상승 에지 검출</text>
  <text class="s mono" x="365" y="222" font-size="12" text-anchor="middle">prev==0 and</text>
  <text class="s mono" x="365" y="238" font-size="12" text-anchor="middle">now==1</text>
  <line class="ln" x1="262" y1="108" x2="300" y2="108"/><path class="ln" d="M300,108 L300,166" marker-end="url(#ar)"/>

  <!-- 동작 표 -->
  <text class="s" x="476" y="44" font-size="13">출력</text>
  <text class="s" x="530" y="44" font-size="13">동작</text>
  <text class="s" x="770" y="44" font-size="13">부르는 ROS 인터페이스</text>

  <g font-size="13">
    <!-- 8 rows, y0 = 54, h 40 -->
    <g transform="translate(0,54)">
      <rect class="row" x="466" y="0" width="470" height="36" rx="6"/><rect class="hl" x="466" y="0" width="470" height="36" rx="6"/>
      <text class="t mono" x="478" y="23" font-weight="700">0</text><text class="t" x="530" y="23">리프트·컨베이어 start=0</text>
      <rect class="tagc" x="762" y="8" width="164" height="20" rx="10"/><text class="t mono" x="844" y="22" font-size="11" text-anchor="middle">conveyor_auto_move_cmd</text>
    </g>
    <g transform="translate(0,94)">
      <rect class="row" x="466" y="0" width="470" height="36" rx="6"/><rect class="hl r1" x="466" y="0" width="470" height="36" rx="6"/>
      <text class="t mono" x="478" y="23" font-weight="700">1</text><text class="t" x="530" y="23">리프트·컨베이어 start=8</text>
      <rect class="tagc" x="762" y="8" width="164" height="20" rx="10"/><text class="t mono" x="844" y="22" font-size="11" text-anchor="middle">conveyor_auto_move_cmd</text>
    </g>
    <g transform="translate(0,134)">
      <rect class="row" x="466" y="0" width="470" height="36" rx="6"/><rect class="hl r2" x="466" y="0" width="470" height="36" rx="6"/>
      <text class="t mono" x="478" y="23" font-weight="700">2</text><text class="t" x="530" y="23">팬 90° (서보 1)</text>
      <rect class="tags" x="762" y="8" width="164" height="20" rx="10"/><text class="t mono" x="844" y="22" font-size="11" text-anchor="middle">herkulex/set_angle</text>
    </g>
    <g transform="translate(0,174)">
      <rect class="row" x="466" y="0" width="470" height="36" rx="6"/><rect class="hl r3" x="466" y="0" width="470" height="36" rx="6"/>
      <text class="t mono" x="478" y="23" font-weight="700">3</text><text class="t" x="530" y="23">팬 0° (서보 1)</text>
      <rect class="tags" x="762" y="8" width="164" height="20" rx="10"/><text class="t mono" x="844" y="22" font-size="11" text-anchor="middle">herkulex/set_angle</text>
    </g>
    <g transform="translate(0,214)">
      <rect class="row" x="466" y="0" width="470" height="36" rx="6"/><rect class="hl r4" x="466" y="0" width="470" height="36" rx="6"/>
      <text class="t mono" x="478" y="23" font-weight="700">4</text><text class="t" x="530" y="23">틸트 80° (서보 2)</text>
      <rect class="tags" x="762" y="8" width="164" height="20" rx="10"/><text class="t mono" x="844" y="22" font-size="11" text-anchor="middle">herkulex/set_angle</text>
    </g>
    <g transform="translate(0,254)">
      <rect class="row" x="466" y="0" width="470" height="36" rx="6"/><rect class="hl r5" x="466" y="0" width="470" height="36" rx="6"/>
      <text class="t mono" x="478" y="23" font-weight="700">5</text><text class="t" x="530" y="23">틸트 0° (서보 2)</text>
      <rect class="tags" x="762" y="8" width="164" height="20" rx="10"/><text class="t mono" x="844" y="22" font-size="11" text-anchor="middle">herkulex/set_angle</text>
    </g>
    <g transform="translate(0,294)">
      <rect class="row" x="466" y="0" width="470" height="36" rx="6"/><rect class="hl r6" x="466" y="0" width="470" height="36" rx="6"/>
      <text class="t mono" x="478" y="23" font-weight="700">6</text><text class="t" x="530" y="23">팔 6관절 모두 0° (6초)</text>
      <rect class="taga" x="762" y="8" width="164" height="20" rx="10"/><text class="t mono" x="844" y="22" font-size="11" text-anchor="middle">follow_joint_trajectory</text>
    </g>
    <g transform="translate(0,334)">
      <rect class="row" x="466" y="0" width="470" height="36" rx="6"/><rect class="hl r7" x="466" y="0" width="470" height="36" rx="6"/>
      <text class="t mono" x="478" y="23" font-weight="700">7</text><text class="t" x="530" y="23">팔 접기: 어깨 80°·팔꿈치 −150°</text>
      <rect class="taga" x="762" y="8" width="164" height="20" rx="10"/><text class="t mono" x="844" y="22" font-size="11" text-anchor="middle">follow_joint_trajectory</text>
    </g>
  </g>

  <!-- 에지 → 표 -->
  <path class="ln" d="M442,210 L462,210" marker-end="url(#ar)"/>
  <line class="ln" x1="455" y1="72" x2="455" y2="352"/>

  <!-- 되돌리기 -->
  <path class="back" d="M700,392 L700,412 L274,412 L274,140 L266,140" marker-end="url(#arr)"/>
  <text class="h" x="410" y="436" font-size="13" text-anchor="middle" font-weight="700">실행 뒤 그 출력만 0 으로 → <tspan class="mono">power_outport_cmd</tspan> (나머지 7개는 받은 값 그대로)</text>
</svg>
